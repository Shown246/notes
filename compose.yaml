name: secure-notes
services:
  mongodb:
    image: mongo:8.0.34
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try {
            const status = rs.status();
            if (status.ok !== 1) quit(1);
          } catch (error) {
            if (error.code !== 94) quit(1);
            rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
volumes:
  mongo-data:
